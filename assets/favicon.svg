<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>打造你的第一個 AI 助理</title>
  <!-- 東吳元素龍蝦：從外雙溪探出頭，背後是文間山，舉鉗迎接一顆靈感星 -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="16"/></clipPath>
    <mask id="pinchL"><rect width="64" height="64" fill="#fff"/><path d="M12 22 L4 6 L20 8 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/></mask>
    <mask id="pinchR"><rect width="64" height="64" fill="#fff"/><path d="M52 22 L60 6 L44 8 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/></mask>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#fff4e2"/>
    <!-- 文間山 -->
    <path d="M0 44 L0 34 Q10 24 20 31 Q30 20 42 28 Q52 22 64 30 L64 44 Z" fill="#9cc5a1"/>
    <!-- 龍蝦 -->
    <g stroke="#b3122e" stroke-linecap="round" fill="none">
      <path d="M28 27 Q22 12 10 6" stroke-width="1.6"/>
      <path d="M36 27 Q42 12 54 6" stroke-width="1.6"/>
      <path d="M25 40 Q16 38 14 26" stroke-width="5"/>
      <path d="M39 40 Q48 38 50 26" stroke-width="5"/>
    </g>
    <circle cx="13" cy="21" r="8" fill="#d7263d" mask="url(#pinchL)"/>
    <circle cx="51" cy="21" r="8" fill="#d7263d" mask="url(#pinchR)"/>
    <ellipse cx="32" cy="42" rx="11" ry="14" fill="#d7263d"/>
    <circle cx="27" cy="31" r="4" fill="#fff"/>
    <circle cx="37" cy="31" r="4" fill="#fff"/>
    <circle cx="27.6" cy="31.6" r="2.2" fill="#2b0d12"/>
    <circle cx="37.6" cy="31.6" r="2.2" fill="#2b0d12"/>
    <ellipse cx="25" cy="39" rx="2.4" ry="1.5" fill="#ff9aa2"/>
    <ellipse cx="39" cy="39" rx="2.4" ry="1.5" fill="#ff9aa2"/>
    <path d="M29 39 Q32 42 35 39" fill="none" stroke="#2b0d12" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 外雙溪 -->
    <path d="M0 50 Q8 46 16 50 T32 50 T48 50 T64 50 L64 64 L0 64 Z" fill="#3f86c6"/>
    <path d="M4 57 Q10 54 16 57 M36 58 Q42 55 48 58" fill="none" stroke="#bfe0f5" stroke-width="2" stroke-linecap="round"/>
    <!-- 金色靈感星 -->
    <path d="M32 6 Q32.8 10.2 37 11 Q32.8 11.8 32 16 Q31.2 11.8 27 11 Q31.2 10.2 32 6 Z" fill="#f2b21b"/>
  </g>
</svg>
